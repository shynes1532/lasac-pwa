<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-72x72.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#dc2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grupo LASAC" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO -->
    <meta name="description" content="Grupo LASAC - Concesionario de FIAT, JAC Motors, Forthing y Dongfeng en Tierra del Fuego. Venta de 0km, Plan de Ahorro y Service en Ushuaia y Río Grande." />
    <meta name="keywords" content="FIAT, JAC Motors, Forthing, Dongfeng, concesionario, Ushuaia, Río Grande, Tierra del Fuego, 0km, plan ahorro, service" />

    <!-- Open Graph -->
    <meta property="og:title" content="Grupo LASAC - FIAT, JAC, Forthing y Dongfeng" />
    <meta property="og:description" content="Venta de 0km, Plan de Ahorro y Service en Tierra del Fuego" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lasac.com.ar" />

    <title>Grupo LASAC - FIAT, JAC, Forthing y Dongfeng | Tierra del Fuego</title>
    
    <style>
      /* Splash screen mientras carga */
      #splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 200px;
        height: 50px;
        animation: pulse 2s infinite;
      }
      #splash .loader {
        width: 40px;
        height: 40px;
        margin-top: 30px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #dc2626;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash">
      <svg viewBox="0 0 200 50">
        <text x="10" y="38" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#e5e7eb" letter-spacing="2">LASAC</text>
        <path d="M155 8 Q175 8 175 25 Q175 42 155 42" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M160 12 Q177 12 177 25 Q177 38 160 38" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M165 16 Q179 16 179 25 Q179 34 165 34" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="loader"></div>
    </div>
    
    <div id="root"></div>

    <!-- OneSignal Web Push - Notificaciones de ofertas (solo producción) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      (function () {
        var h = location.hostname;
        var esDev = h === 'localhost' || h === '127.0.0.1' ||
          /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h) || location.port === '3000';
        if (esDev) return; // en desarrollo no inicializamos push
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.init({
            appId: "TU_APP_ID_AQUI", // ⚠️ Reemplazar con el App ID real de OneSignal
            notifyButton: {
              enable: true, size: 'medium', position: 'bottom-right',
              offset: { bottom: '80px', right: '16px' },
              text: {
                'tip.state.unsubscribed': '🔔 Recibí ofertas exclusivas',
                'tip.state.subscribed': '✅ Estás suscripto a ofertas',
                'tip.state.blocked': 'Activá las notificaciones',
                'message.prenotify': 'Click para recibir ofertas',
                'message.action.subscribed': '¡Listo! Te avisaremos de las mejores ofertas 🚗',
                'message.action.resubscribed': '¡Listo! Te avisaremos de las mejores ofertas 🚗',
                'message.action.unsubscribed': 'Ya no recibirás notificaciones',
                'dialog.main.title': 'Grupo LASAC - Notificaciones',
                'dialog.main.button.subscribe': 'SUSCRIBIRME',
                'dialog.main.button.unsubscribe': 'CANCELAR',
                'dialog.blocked.title': 'Activá las notificaciones',
                'dialog.blocked.message': 'Seguí estos pasos para recibir nuestras ofertas:'
              }
            },
          });
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      // En desarrollo (localhost / IP de red local / puerto 3000) NO usamos el SW,
      // para que los cambios se vean al instante. Además desregistramos cualquier SW
      // viejo y limpiamos sus caches. En producción sí se registra como PWA.
      (function () {
        var h = location.hostname;
        var esDev = h === 'localhost' || h === '127.0.0.1' ||
          /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h) ||
          location.port === '3000';

        if (!('serviceWorker' in navigator)) return;

        if (esDev) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          return;
        }

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(function (registration) {
              console.log('SW registrado:', registration.scope);
              // Chequear si hay una versión nueva publicada
              registration.update();
            })
            .catch(function (error) {
              console.log('SW error:', error);
            });

          // Si la página ya estaba controlada por un service worker y entra uno
          // nuevo (deploy nuevo), recargar UNA sola vez para mostrar la versión
          // actualizada. El guard evita bucles de recarga.
          if (navigator.serviceWorker.controller) {
            var recargado = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (recargado) return;
              recargado = true;
              window.location.reload();
            });
          }
        });
      })();
      
      // Hide splash when app loads
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          document.getElementById('splash').classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
